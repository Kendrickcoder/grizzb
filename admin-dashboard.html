<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pharmacy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="topnav">
        <h2>Admin Dashboard</h2>
        <div class="topnav-links">
            <a href="admin-dashboard.html">🏠 Home</a>
            <a href="view.html">📋 View Medicines</a>
            <a href="add.html">➕ Add Medicine</a>
            <a href="profile.html">👤 Profile</a>
            <a href="#" onclick="logout(); return false;">🚪 Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="welcome">
            <h1>Welcome, <span id="fullname"></span> 👑</h1>
        </div>

        <a href="report.html" class="action-btn action-btn-red">📊 Generate Expiry & Low Stock Report</a>
        <a href="sales-report.html" class="action-btn action-btn-green">💰 View Sales Records</a>

        <div class="cards">
            <div class="card"><h3>Total Medicines</h3><p class="total" id="total">–</p></div>
            <div class="card"><h3>Low Stock (&lt; 10)</h3><p class="total low" id="lowStock">–</p></div>
            <div class="card"><h3>Expired Medicines</h3><p class="total expired-text" id="expired">–</p></div>
            <div class="card"><h3>Total Stock Value</h3><p class="total" id="totalValue">–</p></div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        requireAdmin();
        document.getElementById("fullname").textContent = getUser().fullname;

        api("/dashboard.php").then((d) => {
            document.getElementById("total").textContent = d.total;
            document.getElementById("lowStock").textContent = d.low_stock;
            document.getElementById("expired").textContent = d.expired;
            document.getElementById("totalValue").textContent = money(d.total_value);
        }).catch((err) => alert(err.message));
    </script>
</body>
</html>
