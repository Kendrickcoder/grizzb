<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report - Pharmacy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
    <a href="admin-dashboard.html" class="action-btn action-btn-blue no-print">← Back to Dashboard</a>
    <button onclick="window.print()" class="action-btn action-btn-green no-print" style="width:auto;">🖨️ Print / Save as PDF</button>

    <h2>💰 Sales Record Report</h2>

    <table id="salesTable" style="display:none;">
        <tr>
            <th>Date & Time</th><th>Medicine Name</th><th>Quantity Sold</th>
            <th>Price per Unit</th><th>Total Amount</th><th>Sold By</th>
        </tr>
        <tbody id="rows"></tbody>
    </table>
    <p id="emptyMsg" style="text-align:center; font-size:18px; color:#666; display:none;">No sales recorded yet.</p>

<script src="assets/js/api.js"></script>
<script>
    requireAdmin();
    api("/sales.php").then((sales) => {
        if (sales.length === 0) {
            document.getElementById("emptyMsg").style.display = "block";
            return;
        }
        document.getElementById("salesTable").style.display = "table";
        document.getElementById("rows").innerHTML = sales.map((s) => `
            <tr>
                <td>${s.sold_at}</td>
                <td>${escapeHtml(s.medicine_name)}</td>
                <td>${s.quantity_sold}</td>
                <td>${money(s.price_per_unit)}</td>
                <td><strong>${money(s.total_amount)}</strong></td>
                <td>${escapeHtml(s.staff_name)}</td>
            </tr>`).join("");
    }).catch((err) => alert(err.message));
</script>
</div>
</body>
</html>
