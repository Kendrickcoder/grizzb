<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine - Pharmacy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="center-page">
    <div class="card-container">
        <h2>Add New Medicine</h2>

        <p class="success" id="successMsg" style="display:none;"></p>
        <p class="error" id="errorMsg" style="display:none;"></p>

        <form id="addForm">
            <div class="form-group">
                <label>Medicine Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Price (₦)</label>
                <input type="number" name="price" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" required>
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="date" name="expiry_date">
            </div>
            <button type="submit" class="btn-green">Add Medicine</button>
        </form>

        <div class="nav-link-row">
            <a href="view.html">← Back to Medicines List</a>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        requireLogin();
        document.getElementById("addForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("errorMsg");
            const okEl = document.getElementById("successMsg");
            errEl.style.display = "none";
            okEl.style.display = "none";
            const fd = new FormData(e.target);
            try {
                await api("/medicines.php", {
                    method: "POST",
                    body: {
                        name: fd.get("name"),
                        price: parseFloat(fd.get("price")),
                        quantity: parseInt(fd.get("quantity"), 10),
                        expiry_date: fd.get("expiry_date") || null,
                    },
                });
                okEl.textContent = "Medicine added successfully!";
                okEl.style.display = "block";
                e.target.reset();
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
