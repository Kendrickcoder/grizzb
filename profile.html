<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="topnav">
        <h2>Admin Profile</h2>
        <div class="topnav-links">
            <a href="admin-dashboard.html">🏠 Dashboard</a>
            <a href="view.html">📋 Medicines</a>
            <a href="#" onclick="logout(); return false;">🚪 Logout</a>
        </div>
    </div>

    <div class="container-narrow" style="background:white; padding:40px; border-radius:16px; box-shadow:0 15px 35px rgba(0,0,0,0.15);">
        <h2>My Profile</h2>

        <div class="info-box">
            <strong>Full Name:</strong> <span id="pFullname"></span><br>
            <strong>Username:</strong> <span id="pUsername"></span><br>
            <strong>Role:</strong> Administrator<br>
            <strong>Account Created:</strong> <span id="pCreated"></span>
        </div>

        <p class="success" id="successMsg" style="display:none;"></p>
        <p class="error" id="errorMsg" style="display:none;"></p>

        <h3>Update Profile</h3>
        <form id="profileForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullname" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>New Password (leave empty if you don't want to change)</label>
                <input type="password" name="new_password" placeholder="Enter new password">
            </div>
            <button type="submit">Update Profile</button>
        </form>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        requireAdmin();
        const form = document.getElementById("profileForm");

        api("/profile.php").then((p) => {
            document.getElementById("pFullname").textContent = p.fullname;
            document.getElementById("pUsername").textContent = p.username;
            document.getElementById("pCreated").textContent = p.created_at || "N/A";
            form.fullname.value = p.fullname;
            form.username.value = p.username;
        }).catch((err) => alert(err.message));

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("errorMsg");
            const okEl = document.getElementById("successMsg");
            errEl.style.display = "none";
            okEl.style.display = "none";
            const fd = new FormData(form);
            try {
                await api("/profile.php", {
                    method: "POST",
                    body: {
                        fullname: fd.get("fullname"),
                        username: fd.get("username"),
                        new_password: fd.get("new_password"),
                    },
                });
                const user = getUser();
                user.fullname = fd.get("fullname");
                user.username = fd.get("username");
                localStorage.setItem("user", JSON.stringify(user));
                okEl.textContent = "✅ Profile updated successfully!";
                okEl.style.display = "block";
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
