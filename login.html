<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pharmacy System</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="center-page">

    <div class="card-container">
        <h2>Pharmacy Management System</h2>
        <h3>Login</h3>

        <p class="error" id="errorMsg" style="display:none;"></p>

        <form id="loginForm">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
        </form>

        <p class="nav-link-row">
            Don't have an account? <a href="register.html">Register Here</a>
        </p>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("errorMsg");
            errEl.style.display = "none";
            const fd = new FormData(e.target);
            try {
                const data = await api("/login.php", {
                    method: "POST",
                    body: { username: fd.get("username"), password: fd.get("password") },
                });
                setSession(data.token, data.user);
                window.location.href = data.user.role === "admin" ? "admin-dashboard.html" : "staff-dashboard.html";
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
