<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pharmacy System</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="center-page">
    <div class="card-container">
        <h2>Pharmacy Management System</h2>
        <h3>Create New Account</h3>

        <p class="error" id="errorMsg" style="display:none;"></p>
        <p class="success" id="successMsg" style="display:none;"></p>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullname" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Register as Staff</button>
        </form>

        <p class="nav-link-row">
            Already have an account? <a href="login.html">Login Here</a>
        </p>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("errorMsg");
            const okEl = document.getElementById("successMsg");
            errEl.style.display = "none";
            okEl.style.display = "none";
            const fd = new FormData(e.target);
            try {
                await api("/register.php", {
                    method: "POST",
                    body: {
                        fullname: fd.get("fullname"),
                        username: fd.get("username"),
                        password: fd.get("password"),
                    },
                });
                okEl.textContent = "Registration successful! You can now login.";
                okEl.style.display = "block";
                e.target.reset();
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
