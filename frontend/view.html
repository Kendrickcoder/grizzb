<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Medicines - Pharmacy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="header">
        <h2 style="text-align:center; color:#1e3a8a;">Pharmacy Management System</h2>
    </div>

    <div class="nav" style="text-align:center; margin: 15px 0 25px;">
        <a href="add.html">➕ Add Medicine</a> |
        <a href="#" id="dashLink">Dashboard</a> |
        <a href="#" onclick="logout(); return false;">Logout</a>
    </div>

    <p class="success" id="successMsg" style="display:none;"></p>
    <p class="error" id="errorMsg" style="display:none;"></p>

    <div class="search-container">
        <form id="searchForm">
            <input type="text" name="search" id="searchBox" class="search-box" placeholder="Search medicine name...">
            <button type="submit" style="width:auto; display:inline-block; padding:12px 18px;">Search</button>
            <a href="view.html">Clear</a>
        </form>
    </div>

    <h3 style="text-align:center; margin:15px 0; color:#1e3a8a;">Medicines List</h3>

    <div class="table-container">
        <table>
            <tr>
                <th>ID</th><th>Medicine Name</th><th>Price (₦)</th><th>Quantity</th>
                <th>Expiry Date</th><th>Status</th><th>Action</th>
            </tr>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        requireLogin();
        const user = getUser();
        document.getElementById("dashLink").href = user.role === "admin" ? "admin-dashboard.html" : "staff-dashboard.html";

        function statusFor(row) {
            const stock = parseInt(row.quantity, 10);
            let rowClass = "", status = "✅ Normal";
            if (row.expiry_date) {
                const today = new Date();
                const expiry = new Date(row.expiry_date);
                const daysLeft = Math.ceil((expiry - today) / 86400000);
                if (expiry < today) { status = "❌ EXPIRED"; rowClass = "expired"; }
                else if (daysLeft <= 30) { status = `⚠️ Expiring in ${daysLeft} days`; rowClass = "expiring-soon"; }
            }
            if (stock < 10 && rowClass === "") { status = `⚠️ LOW STOCK - Only ${stock} left!`; rowClass = "low-stock"; }
            return { rowClass, status };
        }

        function renderRows(medicines) {
            const tbody = document.getElementById("rows");
            if (medicines.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:#666;">No medicine found.</td></tr>`;
                return;
            }
            tbody.innerHTML = medicines.map((row) => {
                const { rowClass, status } = statusFor(row);
                const action = user.role === "admin"
                    ? `<a href="edit.html?id=${row.id}"><button style="background:#3b82f6; margin-right:5px;">Edit</button></a>
                       <button style="background:#ef4444;" onclick="deleteMedicine(${row.id})">Delete</button>`
                    : `<a href="sell.html?id=${row.id}"><button style="background:#10b981;">Sell</button></a>`;
                return `<tr class="${rowClass}">
                    <td>${row.id}</td>
                    <td>${escapeHtml(row.name)}</td>
                    <td>${Number(row.price).toFixed(2)}</td>
                    <td><strong>${row.quantity}</strong></td>
                    <td>${escapeHtml(row.expiry_date || "N/A")}</td>
                    <td>${status}</td>
                    <td>${action}</td>
                </tr>`;
            }).join("");
        }

        async function loadMedicines(search = "") {
            try {
                const data = await api("/medicines.php" + (search ? "?search=" + encodeURIComponent(search) : ""));
                renderRows(data);
            } catch (err) {
                document.getElementById("errorMsg").textContent = err.message;
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        async function deleteMedicine(id) {
            if (!confirm("Delete this medicine?")) return;
            try {
                await api("/medicine.php?id=" + id, { method: "DELETE" });
                loadMedicines(document.getElementById("searchBox").value);
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById("searchForm").addEventListener("submit", (e) => {
            e.preventDefault();
            loadMedicines(document.getElementById("searchBox").value.trim());
        });

        // Show a message passed via ?msg= from another page (e.g. after a sale)
        const params = new URLSearchParams(window.location.search);
        if (params.get("msg")) {
            const el = document.getElementById("successMsg");
            el.textContent = decodeURIComponent(params.get("msg"));
            el.style.display = "block";
        }

        loadMedicines();
    </script>
</body>
</html>
