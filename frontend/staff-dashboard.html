<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Pharmacy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="topnav staff">
        <h2>Staff Dashboard</h2>
        <div class="topnav-links">
            <a href="staff-dashboard.html">🏠 Home</a>
            <a href="view.html">📋 View Medicines</a>
            <a href="#" onclick="logout(); return false;">🚪 Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="welcome card">
            <h1>Welcome, <span id="fullname"></span> 👋</h1>
            <p class="role">You are logged in as <strong>Staff</strong></p>
        </div>

        <h2 style="margin-bottom: 20px; color: #1e3a8a; text-align:center;">Quick Actions</h2>

        <div class="quick-links">
            <a href="view.html" class="link-card">
                <h3>📋 View Medicines</h3>
                <p>Browse all medicines and check stock</p>
            </a>
            <a href="add.html" class="link-card">
                <h3>➕ Add Medicine</h3>
                <p>Add new medicine to inventory</p>
            </a>
            <a href="view.html" class="link-card">
                <h3>💰 Sell Medicine</h3>
                <p>Find a medicine on the list, then click Sell</p>
            </a>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        requireLogin();
        document.getElementById("fullname").textContent = getUser().fullname;
    </script>
</body>
</html>
