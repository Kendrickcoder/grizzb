<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medicine</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="center-page">
    <div class="card-container">
        <h2>Edit Medicine</h2>

        <p class="error" id="errorMsg" style="display:none;"></p>

        <form id="editForm">
            <div class="form-group">
                <label>Medicine Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Price (₦)</label>
                <input type="number" name="price" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" required>
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="date" name="expiry_date">
            </div>
            <button type="submit">Update Medicine</button>
        </form>
        <div class="nav-link-row">
            <a href="view.html">← Back to List</a>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        requireAdmin();
        const id = new URLSearchParams(window.location.search).get("id");
        if (!id) window.location.href = "view.html";

        const form = document.getElementById("editForm");

        api("/medicine.php?id=" + id).then((m) => {
            form.name.value = m.name;
            form.price.value = m.price;
            form.quantity.value = m.quantity;
            form.expiry_date.value = m.expiry_date || "";
        }).catch((err) => alert(err.message));

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("errorMsg");
            errEl.style.display = "none";
            const fd = new FormData(form);
            try {
                await api("/medicine.php?id=" + id, {
                    method: "PUT",
                    body: {
                        name: fd.get("name"),
                        price: parseFloat(fd.get("price")),
                        quantity: parseInt(fd.get("quantity"), 10),
                        expiry_date: fd.get("expiry_date") || null,
                    },
                });
                window.location.href = "view.html?msg=" + encodeURIComponent("Medicine updated successfully!");
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
