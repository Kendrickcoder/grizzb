<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry & Low Stock Report</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
    <a href="admin-dashboard.html" class="action-btn action-btn-blue no-print">← Back to Dashboard</a>
    <button onclick="window.print()" class="action-btn action-btn-green no-print" style="width:auto;">🖨️ Print / Save as PDF</button>

    <h2>📊 Expiry & Low Stock Report</h2>

    <h3>Near Expiry (Next 30 Days)</h3>
    <table>
        <tr><th>Name</th><th>Price</th><th>Quantity</th><th>Expiry Date</th><th>Days Left</th></tr>
        <tbody id="nearExpiryRows"></tbody>
    </table>

    <h3>Expired Medicines</h3>
    <table>
        <tr><th>Name</th><th>Price</th><th>Quantity</th><th>Expiry Date</th></tr>
        <tbody id="expiredRows"></tbody>
    </table>

    <h3>Low Stock (&lt; 10 units)</h3>
    <table>
        <tr><th>Name</th><th>Price</th><th>Quantity</th><th>Expiry Date</th></tr>
        <tbody id="lowStockRows"></tbody>
    </table>
</div>

<script src="assets/js/api.js"></script>
<script>
    requireAdmin();

    function daysLeft(dateStr) {
        return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
    }

    api("/report.php").then((d) => {
        document.getElementById("nearExpiryRows").innerHTML = d.near_expiry.map((row) => `
            <tr class="near-expiry">
                <td>${escapeHtml(row.name)}</td>
                <td>${money(row.price)}</td>
                <td>${row.quantity}</td>
                <td>${row.expiry_date}</td>
                <td>${daysLeft(row.expiry_date)} days</td>
            </tr>`).join("") || `<tr><td colspan="5" style="text-align:center;">None</td></tr>`;

        document.getElementById("expiredRows").innerHTML = d.expired.map((row) => `
            <tr class="expired">
                <td>${escapeHtml(row.name)}</td>
                <td>${money(row.price)}</td>
                <td>${row.quantity}</td>
                <td>${row.expiry_date}</td>
            </tr>`).join("") || `<tr><td colspan="4" style="text-align:center;">None</td></tr>`;

        document.getElementById("lowStockRows").innerHTML = d.low_stock.map((row) => `
            <tr class="low-stock">
                <td>${escapeHtml(row.name)}</td>
                <td>${money(row.price)}</td>
                <td>${row.quantity}</td>
                <td>${row.expiry_date || "N/A"}</td>
            </tr>`).join("") || `<tr><td colspan="4" style="text-align:center;">None</td></tr>`;
    }).catch((err) => alert(err.message));
</script>
</body>
</html>
